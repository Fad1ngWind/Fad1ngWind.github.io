<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">VLM 与 VLA 的输入输出边界</title>
  <desc id="desc">VLM 将视觉和语言映射到语义输出，VLA 在此基础上把机器人状态纳入上下文并输出可执行动作表示。</desc>
  <defs>
    <marker id="arrow2" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 L12 6 L0 12 Z" fill="#4263eb"/>
    </marker>
    <style>
      .title { font: 700 38px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #172b4d; }
      .head { font: 700 30px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #172b4d; }
      .label { font: 600 24px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #172b4d; }
      .sub { font: 400 20px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #5e6c84; }
      .arrow { stroke: #4263eb; stroke-width: 5; fill: none; marker-end: url(#arrow2); }
    </style>
  </defs>
  <rect width="1400" height="760" rx="28" fill="#f7f9fc"/>
  <text x="700" y="70" text-anchor="middle" class="title">VLM 与 VLA 的边界在输出是否进入行动链路</text>

  <rect x="70" y="125" width="1260" height="250" rx="26" fill="#eef2ff" stroke="#748ffc" stroke-width="3"/>
  <text x="120" y="180" class="head">VLM</text>
  <rect x="120" y="220" width="220" height="100" rx="18" fill="#ffffff" stroke="#91a7ff" stroke-width="2"/>
  <text x="230" y="260" text-anchor="middle" class="label">视觉 + 语言</text>
  <text x="230" y="292" text-anchor="middle" class="sub">图像、视频、提示词</text>
  <path d="M340 270 H485" class="arrow"/>
  <rect x="500" y="205" width="300" height="130" rx="22" fill="#dbe4ff" stroke="#5c7cfa" stroke-width="3"/>
  <text x="650" y="260" text-anchor="middle" class="label">视觉语言建模</text>
  <text x="650" y="295" text-anchor="middle" class="sub">跨模态对齐与推理</text>
  <path d="M800 270 H945" class="arrow"/>
  <rect x="960" y="220" width="300" height="100" rx="18" fill="#ffffff" stroke="#91a7ff" stroke-width="2"/>
  <text x="1110" y="260" text-anchor="middle" class="label">语义输出</text>
  <text x="1110" y="292" text-anchor="middle" class="sub">文本、类别、坐标、表示</text>

  <rect x="70" y="425" width="1260" height="270" rx="26" fill="#ebfbee" stroke="#51cf66" stroke-width="3"/>
  <text x="120" y="480" class="head">VLA</text>
  <rect x="120" y="525" width="280" height="110" rx="18" fill="#ffffff" stroke="#8ce99a" stroke-width="2"/>
  <text x="260" y="565" text-anchor="middle" class="label">视觉 + 语言 + 状态</text>
  <text x="260" y="600" text-anchor="middle" class="sub">关节、末端、历史观测</text>
  <path d="M400 580 H505" class="arrow"/>
  <rect x="520" y="510" width="300" height="140" rx="22" fill="#d3f9d8" stroke="#40c057" stroke-width="3"/>
  <text x="670" y="568" text-anchor="middle" class="label">视觉语言动作策略</text>
  <text x="670" y="603" text-anchor="middle" class="sub">任务条件下预测动作</text>
  <path d="M820 580 H925" class="arrow"/>
  <rect x="940" y="525" width="320" height="110" rx="18" fill="#ffffff" stroke="#8ce99a" stroke-width="2"/>
  <text x="1100" y="565" text-anchor="middle" class="label">动作表示</text>
  <text x="1100" y="600" text-anchor="middle" class="sub">位姿增量、夹爪、动作块</text>

  <text x="700" y="730" text-anchor="middle" class="sub">VLA 的输出仍需经过安全约束、坐标变换和底层控制，才能驱动物理执行器</text>
</svg>

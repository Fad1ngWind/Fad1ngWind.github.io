<script>
    (() => {
        const input = document.getElementById("searchInput");
        const results = document.getElementById("searchResults");
        const index = fetch("/index.json").then((response) => {
            if (!response.ok) {
                throw new Error(`Search index request failed: ${response.status}`);
            }
            return response.json();
        });

        function resultPath(permalink) {
            try {
                return new URL(permalink, window.location.origin).pathname;
            } catch {
                return permalink;
            }
        }

        function render(items) {
            results.replaceChildren();
            for (const item of items) {
                const entry = document.createElement("li");
                const link = document.createElement("a");
                const title = document.createElement("header");
                const summary = document.createElement("p");

                link.href = resultPath(item.permalink);
                title.textContent = item.title;
                summary.textContent = item.summary || "";
                link.append(title, summary);
                entry.append(link);
                results.append(entry);
            }
        }

        input.addEventListener("input", async () => {
            const query = input.value.trim().toLocaleLowerCase();
            if (!query) {
                results.replaceChildren();
                return;
            }

            try {
                const posts = await index;
                const matches = posts
                    .map((post) => {
                        const title = post.title.toLocaleLowerCase();
                        const content = post.content.toLocaleLowerCase();
                        const score = title === query ? 3 : title.includes(query) ? 2 : content.includes(query) ? 1 : 0;
                        return { post, score };
                    })
                    .filter(({ score }) => score > 0)
                    .sort((a, b) => b.score - a.score)
                    .slice(0, 10)
                    .map(({ post }) => post);
                render(matches);
            } catch {
                results.replaceChildren();
                const message = document.createElement("li");
                message.textContent = "搜索索引暂时无法加载，请稍后重试。";
                results.append(message);
            }
        });
    })();
</script>
